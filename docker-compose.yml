services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav_db:/var/lib/clamav
      # ファイル本体を同一パスで共有（パス指定スキャンのため読み取り専用）
      - uploads_data:/data/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3310' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 初回はシグネチャDLに数分かかる
      start_period: 300s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sharefile.rule=Host(`sharefile.hijoushoku.com`)"
      - "traefik.http.services.sharefile.loadbalancer.server.port=3000"
      - "traefik.docker.network=cloudflared_tunnel_net"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudflare_tunnel_net
      - backend
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - backend
networks:
  cloudflare_tunnel_net:
    external: true
    name: cloudflared_tunnel_net
  backend:
    driver: bridge
volumes:
  pg_data:
  redis_data:
  clamav_db:
  uploads_data:
