# clamd 設定 — 大容量ファイル対応
# 注意: ClamAV のスキャン上限は最大 4GB 程度。これを超える部分はスキャンされない。

# TCP で待ち受け（worker からパス指定スキャン）
TCPSocket 3310
TCPAddr 0.0.0.0

# ローカルソケット（ヘルスチェック等）
LocalSocket /tmp/clamd.sock

Foreground yes
LogTime yes

# スキャン上限を可能な限り引き上げ（最大値はビルド依存、概ね 4000M）
MaxFileSize 4000M
MaxScanSize 4000M
StreamMaxLength 4000M

# 解凍・再帰の上限
MaxRecursion 16
MaxFiles 50000

MaxThreads 4
