# clamd 設定 — 10GiBファイル対応

# TCP で待ち受け（worker からパス指定スキャン）
TCPSocket 3310
TCPAddr 0.0.0.0

# ローカルソケット（ヘルスチェック等）
LocalSocket /tmp/clamd.sock

Foreground yes
LogTime yes

# MaxFileSize は通常値が32-bitサイズだが、0で入力ファイル上限を無効化できる。
# 実際の受理上限はアプリ側の MAX_FILE_SIZE=10GiB で強制する。
MaxFileSize 0
MaxScanSize 10G

# 本アプリは共有ボリュームへのパス指定SCANを使うためINSTREAMは使用しない。
# ストリーム上限は防御的に既定相当へ抑える。
StreamMaxLength 100M

# 10GiBのスキャンに備え、アプリ側のソケットタイムアウトと同じ30分にする。
MaxScanTime 1800000

# 解凍・再帰の上限
MaxRecursion 16
MaxFiles 50000

MaxThreads 4
